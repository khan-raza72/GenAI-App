<!DOCTYPE html>
<                                                                                                                    html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Navigation Bar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        .navbar {
            height: 60px;
            background-color: #131921;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
        }

        .nav-logo {
            width: 100px;
            height: 50px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .logo {
            background: url('https://pngimg.com/uploads/amazon/amazon_PNG11.png') no-repeat;
            background-size: contain;
            width: 100%;
            height: 30px;
        }

        .nav-address {
            display: flex;
            align-items: center;
            padding: 8px;
            cursor: pointer;
        }

        .address-icon {
            margin-right: 5px;
        }

        .nav-address:hover {
            border: 1px solid white;
        }

        .address-line1 {
            font-size: 12px;
            color: #ccc;
        }

        .address-line2 {
            font-size: 14px;
            font-weight: bold;
        }

        .nav-search {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: white;
            border-radius: 4px;
            width: 50%;
            height: 40px;
        }

        .search-select {
            background-color: #f3f3f3;
            width: 50px;
            height: 40px;
            border: none;
            border-radius: 4px 0 0 4px;
            cursor: pointer;
        }

        .search-input {
            width: 100%;
            height: 40px;
            border: none;
            outline: none;
            padding: 0 10px;
            font-size: 16px;
        }

        .search-icon {
            width: 45px;
            height: 40px;
            background-color: #febd69;
            color: #131921;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
        }

        .nav-signin {
            padding: 8px;
            cursor: pointer;
        }

        .nav-signin:hover {
            border: 1px solid white;
        }

        .signin-line1 {
            font-size: 12px;
        }

        .signin-line2 {
            font-size: 14px;
            font-weight: bold;
        }

        .nav-return {
            padding: 8px;
            cursor: pointer;
        }

        .nav-return:hover {
            border: 1px solid white;
        }

        .return-line1 {
            font-size: 12px;
        }

        .return-line2 {
            font-size: 14px;
            font-weight: bold;
        }

        .nav-cart {
            display: flex;
            align-items: center;
            padding: 8px;
            cursor: pointer;
        }

        .nav-cart:hover {
            border: 1px solid white;
        }

        .cart-icon {
            font-size: 28px;
            margin-right: 5px;
        }

        .cart-text {
            font-weight: bold;
        }

        .nav-second {
            height: 39px;
            background-color: #232f3e;
            display: flex;
            align-items: center;
            padding: 0 15px;
            color: white;
        }

        .nav-second a {
            color: white;
            text-decoration: none;
            padding: 8px;
            margin-right: 10px;
            font-size: 14px;
        }

        .nav-second a:hover {
            border: 1px solid white;
        }

        .menu-icon {
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <header>
        <div class="navbar">
            <div class="nav-logo">
                <div class="logo"></div>
            </div>

            <div class="nav-address">
                <div class="address-icon">
                    <i class="fas fa-map-marker-alt"></i>
                </div>
                <div class="address-text">
                    <div class="address-line1">Deliver to</div>
                    <div class="address-line2">India</div>
                </div>
            </div>

            <div class="nav-search">
                <select class="search-select">
                    <option>All</option>
                </select>
                <input type="text" class="search-input" placeholder="Search Amazon">
                <div class="search-icon">
                    <i class="fas fa-search"></i>
                </div>
            </div>

            <div class="nav-signin">
                <div class="signin-line1">Hello, Sign in</div>
                <div class="signin-line2">Account & Lists</div>
            </div>

            <div class="nav-return">
                <div class="return-line1">Returns</div>
                <div class="return-line2">& Orders</div>
            </div>

            <div class="nav-cart">
                <i class="fas fa-shopping-cart cart-icon"></i>
                <div class="cart-text">Cart</div>
            </div>
        </div>

        <div class="nav-second">
            <a href="#"><i class="fas fa-bars menu-icon"></i>All</a>
            <a href="#">Today's Deals</a>
            <a href="#">Customer Service</a>
            <a href="#">Registry</a>
            <a href="#">Gift Cards</a>
            <a href="#">Sell</a>
        </div>
    </header>
</body>
</html>
