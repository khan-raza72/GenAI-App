<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position Concepts</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        .box {
            width: 150px;
            height: 80px;
            margin: 20px;
            padding: 10px;
            color: #fff;
            font-weight: bold;
            text-align: center;
            border-radius: 8px;
        }
        /* Static position (default) */
        .static {
            background: #4caf50;
            position: static;
        }
        /* Relative position */
        .relative {
            background: #2196f3;
            position: relative;
            top: 30px;
            left: 30px;
        }
        /* Absolute position */
        .absolute-container {
            position: relative;
            height: 200px;
            background: #eee;
            margin-bottom: 30px;
        }
        .absolute {
            background: #ff9800;
            position: absolute;
            top: 40px;
            left: 60px;
        }
        /* Fixed position */
        .fixed {
            background: #e91e63;
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 100;
        }
        /* Sticky position */
        .sticky {
            background: hwb(261 2% 11%);
            position: sticky;
            top: 0;
        }
        #container {
            position: absolute;
            background-color: grey ;
            height: 100%;
            width: 100%;
        }
        a {
            display: inline-block;
            margin: 10px;
            padding: 10px 15px;
            background-color: hsl(168, 93%, 47%);
            color: #a47070;
            text-decoration: blueviolet;
        }
    </style>
</head>
<body>
    <div id="container">
        <a href="https://www.google.com">Google</a>
        <a href="https://www.example.com">Example</a>
        <a href="https://www.test.com">Test</a>
        <a href="https://www.sample.com">Sample</a>
        <a href="https://www.demo.com">Demo</a>
    <h1>CSS Position Property Examples</h1>
    <div class="box static">Static (default)</div>
    <div class="box relative">Relative</div>
    <div class="absolute-container">
        <div class="box absolute">Absolute (inside relative)</div>
    </div>
    <div class="box sticky">Sticky (scroll down)</div>
    <div style="height: 300px;">
        <!-- Spacer to show sticky effect -->
    </div>
    <div class="box fixed">Fixed (top-right)</div>
    </div>
</body>
</html>
